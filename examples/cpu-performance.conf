# Default CPU frequency ceilings, written once at boot by systemd-tmpfiles and
# read by the CPU Limits service as each core group's default.
# Every cpufreq policy needs one scaling_max_freq line (kHz). Policies with the
# same turbo maximum form one group and must share one value. Adjust the policy
# numbers and values to your CPU (see /sys/devices/system/cpu/cpufreq/policy*/cpuinfo_max_freq).
w /sys/devices/system/cpu/intel_pstate/max_perf_pct - - - - 100
# Performance cores
w /sys/devices/system/cpu/cpufreq/policy[0-7]/scaling_max_freq - - - - 5000000
# Efficient cores
w /sys/devices/system/cpu/cpufreq/policy[89]/scaling_max_freq - - - - 3800000
w /sys/devices/system/cpu/cpufreq/policy1[0-5]/scaling_max_freq - - - - 3800000
